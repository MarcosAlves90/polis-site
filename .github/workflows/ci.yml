name: Validate documentation site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.19'
      - name: Install dependencies in an isolated Python environment
        run: uv venv .venv && uv pip install --python .venv/bin/python -r requirements.txt
      - name: Run unit tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Build site
        run: .venv/bin/python build.py
      - name: Check JavaScript syntax
        run: node --check assets/app.js
